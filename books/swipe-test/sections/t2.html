<!DOCTYPE html>

<body data-ch="t2">
<main class="ctl-main">

  <h1>T2 · 含交互图的页面</h1>

  <div class="ctl-supp"><span class="ctl-tag" data-src="测试说明">测</span>
  这一页有可拖拽的交互图。<b>图本身要能正常拖</b>，而页尾的翻章栏照常出现——两者互不干扰。</div>

  <div data-primitive="polezero-drag" data-title="交互图 ①：在 s 平面上拖极点与零点"></div>
  <div data-primitive="root-locus" data-title="交互图 ②：拖 K，看闭环极点沿根轨迹移动"></div>

  <h2>测点</h2>
  <ol>
    <li>在 s 平面图上拖极点 → 只能拖图，不出现任何异常</li>
    <li>拖 K 的滑杆 → 根轨迹上的极点跟着动</li>
    <li>滚到页尾 → 翻章栏在，点「下一节 →」到 T3</li>
  </ol>

</main>
<script src="../../../kit/core/boot.js" data-book="../"></script>
