<body data-ch="t1">
<main class="ctl-main">

  <h1>T1 · 翻章按钮测试 · 起始页</h1>
  <p class="ctl-note">这是临时测试书，不占用 Franklin 的导航。测完可删 <code>books/swipe-test/</code>。</p>

  <div class="ctl-supp"><span class="ctl-tag" data-src="测试说明">测</span>
  滚到本页<b>最下方</b>，页尾有一条翻章栏：左侧「← 上一节」，右侧「下一节 →」并带强调色。点右侧的「下一节 →」应该到 T2。</div>

  <h2>测点</h2>
  <ol>
    <li>页尾翻章栏出现，并且<b>不遮挡</b>正文</li>
    <li>点「下一节 →」→ 到 T2</li>
    <li>到 T2 后点「← 上一节」→ 回到本页</li>
    <li>本页是第一页，左侧位置<b>空着</b>（不显示上一节）</li>
    <li>T4 是最后一页，右侧位置<b>空着</b>（不显示下一节）</li>
  </ol>

</main>
