<body data-ch="t3">
<main class="ctl-main">

  <h1>T3 · 含滑杆与按钮的页面</h1>

  <div class="ctl-supp"><span class="ctl-tag" data-src="测试说明">测</span>
  这一页有滑杆和分段按钮。<b>滑杆要能左右拖到底</b>，分段按钮点了要切换情形，页尾翻章栏照常出现。</div>

  <div data-primitive="step-2nd" data-title="滑杆：拖 ζ 与 ωn"></div>
  <div data-primitive="step-presets" data-title="分段按钮：切换四种阻尼情形"></div>

  <h2>测点</h2>
  <ol>
    <li>两个滑杆都能拖到底，数值跟着变</li>
    <li>点四个分段按钮，曲线跟着切</li>
    <li>滚到页尾 → 点「下一节 →」到 T4</li>
    <li>窄屏：点顶栏「目录」展开后，点屏幕空白处能收起</li>
  </ol>

</main>
