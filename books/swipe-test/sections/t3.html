  <h1>T3 · 护栏二：滑杆与按钮</h1>

  <div class="ctl-supp"><span class="ctl-tag" data-src="测试说明">测</span>
  <strong>在滑杆上左右拖，页面不应该跳走。</strong>滑杆本身就是「左右拖动」的控件，如果手势抢走它，滑杆就废了。</div>

  <div data-primitive="step-2nd" data-title="测点 ⑤：拖 ζ 与 ωn 两个滑杆，左右都可以拖到底"></div>

  <div data-primitive="step-presets" data-title="测点 ⑥：点四个分段按钮切换情形，点的时候页面不应该跳"></div>

  <h2>测点 ⑦：窄屏点屏幕收起目录</h2>
  <p>如果你在手机或竖屏平板上：点顶栏的<b>「目录」</b>把左栏拉出来，然后<b>点屏幕任意空白处</b>——应该收起目录，而且<b>不应该</b>误点到下面的链接。</p>

  <h2>测点 ⑧：再回正文</h2>
  <p>在这一段正文向左划 → 应该正常翻到 T4。</p>
